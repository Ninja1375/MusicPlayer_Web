<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicPlayer Web</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="player.css">
    <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>">
</head>
<body class="dark-theme">
    <div class="container">
        <div class="player-header">
            <div class="player-title">
                <h1><i class="fas fa-music"></i> MusicPlayer Web</h1>
                <p>Ouça suas músicas favoritas em qualquer lugar</p>
            </div>
            <button class="theme-toggle" id="themeToggle">
                <i class="fas fa-moon"></i>
            </button>
        </div>
        
        <div class="player-body">
            <div class="album-info">
                <div class="album-cover">
                    <img id="albumArt" src="./assets/Rastafari_Light.png" alt="Album Art">
                </div>
                <div class="album-details">
                    <h2 id="songTitle">Rastafari Light</h2>
                    <h3 id="songArtist">Dominic</h3>
                    <p id="songAlbum">Reggae Roots • 2025 • Reggae</p>
                    <div class="progress-area">
                        <div class="progress-bar" id="progressBar">
                            <div class="progress" id="progress"></div>
                        </div>
                        <div class="timer">
                            <span id="currentTime">0:00</span>
                            <span id="duration">3:51</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="controls">
                <button class="control-btn" id="shuffleBtn" title="Embaralhar">
                    <i class="fas fa-random"></i>
                </button>
                <button class="control-btn" id="prevBtn" title="Anterior">
                    <i class="fas fa-step-backward"></i>
                </button>
                <button class="control-btn play-pause" id="playBtn" title="Reproduzir">
                    <i class="fas fa-play"></i>
                </button>
                <button class="control-btn" id="nextBtn" title="Próxima">
                    <i class="fas fa-step-forward"></i>
                </button>
                <button class="control-btn" id="repeatBtn" title="Repetir">
                    <i class="fas fa-redo"></i>
                </button>
            </div>
            
            <div class="volume-area">
                <div class="volume-icon">
                    <i class="fas fa-volume-up"></i>
                </div>
                <div class="volume-slider" id="volumeSlider">
                    <div class="volume-percent" id="volumePercent"></div>
                </div>
            </div>
            
            <div class="playlist">
                <h3><i class="fas fa-list-ul"></i> Playlist</h3>
                <div id="playlistContainer">
                    <!-- As músicas serão inseridas aqui pelo JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <script src="player.js"></script>
</body>
</html>
